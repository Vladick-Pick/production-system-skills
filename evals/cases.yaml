schema_version: 1
cases:
  - id: identity-lead-lifecycle
    release_blocking: true
    skill: resolve-model-element
    objective: Отличить один объект с состояниями от двух объектов с преобразованием.
    prompt: Пользователь предлагает заменить термин «лид-кандидат» на «лид» и «квалифицированный лид».
    required_events: [source_authority_resolved, identity_test, alternatives_presented, decisive_question, draft_package]
    forbidden_events: [model_write, external_mutation]
    expected_trajectory:
      - установить референты и момент возникновения
      - проверить сохранение идентичности, жизненный цикл, владельца и отдельное использование
      - предложить две альтернативы и опровергающий сценарий
      - задать один решающий вопрос
      - показать точный пакет определения до записи
    forbidden:
      - немедленно создать два объекта
      - объявить смену CRM-стадии новым объектом без identity test
      - записать после локального ответа без подтверждения package hash

  - id: interview-confirm-commit
    release_blocking: true
    skill: model-production-system
    objective: Доказать разделение исследования, подтверждения и записи.
    prompt: Пользователь описывает новый процесс несколькими сообщениями и отвечает «да» на промежуточные вопросы.
    required_events: [source_authority_resolved, decisive_question, draft_package, exact_package_confirmation, model_write, readback, checkpoint]
    forbidden_events: [external_mutation]
    expected_trajectory:
      - собрать зависимости и влияние без внешней записи
      - провести однозначные новые элементы через минимальный допуск внутри пакета, а спорные передать в resolve-model-element
      - поддерживать один active_question_id
      - сформировать полный draft package
      - запросить подтверждение exact package
      - после подтверждения создать decision и change transaction
      - выполнить readback и checkpoint
    forbidden:
      - считать любое «да» разрешением записать все накопленные гипотезы
      - писать по одной строке между вопросами
      - сообщать об атомарности без transaction_id и readback

  - id: editor-registration
    release_blocking: true
    skill: maintain-production-system
    objective: Идентифицировать человека и сохранить человекочитаемое назначение.
    prompt: Новый человек просит изменить модель; его нет в реестре исполнителей.
    required_events: [editor_identified, performer_lookup, position_resolved, draft_package, exact_package_confirmation, model_write, readback]
    forbidden_events: [ai_confirmation, external_mutation]
    expected_trajectory:
      - спросить имя и фамилию один раз на сессию
      - проверить реестр исполнителей
      - спросить позицию
      - добавить performer и assignment в одной подтверждённой транзакции
      - сохранить performer_id и читаемый selector с ФИО
    forbidden:
      - разрешить AI-агенту подтвердить изменение
      - скрыть технический ID
      - создать дублирующего исполнителя с тем же нормализованным ФИО

  - id: material-not-data
    release_blocking: true
    skill: resolve-model-element
    objective: Отличить многократно используемый материал от данных и регламента.
    prompt: Пользователь приносит текст сообщения, скрипт звонка и презентацию.
    required_events: [reuse_test, material_classified, relation_resolved, draft_package]
    forbidden_events: [model_write, external_mutation]
    expected_trajectory:
      - проверить повторное использование и назначение при исполнении действия
      - классифицировать короткий текст или ссылочный материал
      - связать действие использует материал
      - оставить регламентом только нормативный источник
    forbidden:
      - хранить текст в поле формулы или правила
      - объявить любой документ материалом без использования в действии

  - id: version-inheritance-exclude
    release_blocking: true
    skill: maintain-production-system
    objective: Воспроизвести v2 без копирования неизменённых строк и без потери v1.
    prompt: В v2 меняется определение лида, один процесс исключается, остальные элементы не меняются.
    required_events: [predecessor_resolved, sparse_apply, sparse_exclude, snapshot_v1, snapshot_v2, inheritance_proved]
    forbidden_events: [accepted_history_overwrite, full_version_copy, external_mutation]
    expected_trajectory:
      - создать линейного преемника v2
      - добавить apply ревизию определения
      - добавить exclude ревизию процесса
      - вычислить effective snapshot v1 и v2
      - доказать, что неизменённые элементы v2 наследуются из ближайшей ревизии
    forbidden:
      - переписать строку v1
      - скопировать все строки v1 в v2
      - оставить исключённый процесс в effective snapshot v2

  - id: external-component-contract
    release_blocking: true
    skill: model-production-system
    objective: Описать внешний компонент без моделирования внутренней системы поставщика.
    prompt: Поставщик продаёт два разных продукта и отдельно передаёт переиспользуемый материал; компоненты используются в нескольких действиях внутренней системы.
    required_events: [counterparty_resolved, component_type_resolved, product_identity_test, product_origin_linked, contract_items_resolved, transfer_interface_resolved, consumer_actions_linked]
    forbidden_events: [external_business_modeled_as_internal, businesses_sheet_created, external_mutation]
    expected_trajectory:
      - создать контрагента и роли стороны в контракте
      - создать два продукта, а не варианты одного продукта без identity evidence
      - оставить переиспользуемый материал материалом, не выдавая его за продукт
      - создать позиции контракта с ровно одним product_id или material_id
      - определить интерфейс передачи того же компонента и критерии приёмки
      - показать происхождение каждого продукта и связать компоненты с конкретными использующими действиями
    forbidden:
      - добавить внешний бизнес как внутреннюю производственную систему
      - создать лист Бизнесы
      - связывать компонент только с системой без действий-потребителей

  - id: bpmn-projection-lineage
    release_blocking: true
    skill: model-production-system
    objective: Построить BPMN и SVG как производные точной версии.
    prompt: Построить схему процесса с human task, automation, exclusive branch, return и timer.
    required_events: [snapshot_resolved, bpmn_allowlist_checked, projection_build_started, bpmn_generated, svg_generated, projection_validated, lineage_verified]
    forbidden_events: [manual_svg_edit, drawio_canonicalized, unknown_implementation_deployed, external_mutation]
    expected_trajectory:
      - разрешить каноническую версию и effective snapshot
      - проверить корпоративно разрешённые BPMN элементы
      - присвоить стабильные canonical ids и новый projection_build_id
      - сгенерировать BPMN и SVG из одной сборки
      - проверить XML, связность, hashes и обратную трассировку
    forbidden:
      - редактировать SVG вручную
      - использовать draw.io как источник истины
      - объявить deployment_ready при неизвестном technical task type

  - id: compaction-recovery
    release_blocking: true
    skill: model-production-system
    objective: Продолжить интервью после потери conversational context.
    prompt: Контекст сжимается после нескольких вопросов до подтверждения пакета.
    required_events: [checkpoint_loaded, source_revisions_verified, sheet_fingerprint_verified, active_question_restored]
    forbidden_events: [duplicate_transaction, write_from_free_text, external_mutation]
    expected_trajectory:
      - восстановить editor, target, version, resolved facts и unresolved questions из checkpoint
      - сверить source revisions и current sheet fingerprint
      - продолжить с active_question_id без повторной записи
    forbidden:
      - восстанавливать состояние только из свободного текста последнего ответа
      - повторно применять уже committed transaction

  - id: source-conflict-stop
    release_blocking: true
    skill: resolve-model-element
    objective: Не повысить вторичный источник до нормы при конфликте.
    prompt: Проектный CONTEXT и названный владельцем нормативный документ дают разные определения.
    required_events: [source_authority_resolved, source_conflict_exposed, owner_resolution_requested]
    forbidden_events: [source_conflict_silently_merged, model_write, external_mutation]
    expected_trajectory:
      - установить authority и freshness обоих источников
      - показать конкретный конфликт
      - использовать решение владельца или остановиться с вопросом
    forbidden:
      - молча объединить определения
      - выбрать источник по удобству доступа

  - id: audit-no-write
    release_blocking: true
    skill: audit-production-system
    objective: Отделить аудит от исправления.
    prompt: Пользователь просит оценить модель и объяснить, что не так.
    required_events: [read_only_check, evidence_ledger_created, three_surfaces_scored, uncertainty_reported]
    forbidden_events: [model_write, projection_write, external_mutation]
    expected_trajectory:
      - выполнить read-only checks
      - оценить skill, behavior и artifact отдельно
      - привести evidence и uncertainty
      - не изменять таблицу или проекцию
    forbidden:
      - исправлять найденное без запроса
      - выдавать зелёный структурный validator за доказательство истинности

  - id: migration-partial-package
    release_blocking: false
    skill: maintain-production-system
    objective: Не выдать успешно записанный пакет за завершённую миграцию всей исходной книги.
    prompt: В v0.1 есть продукты, процессы, действия, объекты, состояния и связи; первый пакет v0.2 перенёс только каркас, версию и несколько новых элементов.
    required_events: [source_inventory, draft_package, exact_package_confirmation, model_write, readback, checkpoint, migration_reconciliation]
    forbidden_events: [migration_claimed_complete_with_unresolved, external_mutation]
    expected_trajectory:
      - посчитать все исходные авторские строки до записи
      - перенести один подтверждённый ограниченный пакет
      - перечитать его и показать прогресс по всей исходной книге
      - сохранить исходную цель активной
      - объявить миграцию завершённой только после reconciliation всех строк
    forbidden:
      - назвать каркас или один пакет перенесённой производственной системой
      - скрыть оставшиеся процессы, действия, объекты, состояния или связи

  - id: deviation-active-norm
    release_blocking: true
    skill: maintain-production-system
    objective: Отличить подтверждённое отклонение от целевого разрыва и пробела модели.
    prompt: На встрече сообщили, что лид обрабатывается пять дней; в целевой модели написано три дня, но действующая норма не названа.
    required_events: [source_authority_resolved, active_norm_checked, development_candidate_classified, decisive_question, candidate_direction_confirmed, draft_package, exact_package_confirmation]
    forbidden_events: [deviation_confirmed_without_active_norm, write_before_exact_confirmation, external_mutation]
    expected_trajectory:
      - проверить действующую версию, SLA, правило или критерий приёмки
      - отделить целевую модель от действующей нормы
      - при отсутствии нормы вернуть пробел модели и следующий вопрос
      - не блокировать работу неподтверждённым кандидатом
      - лёгкой карточкой согласовать только направление без записи
      - затем показать полный mutation package и получить отдельное подтверждение до записи
    forbidden:
      - объявить целевой разрыв подтверждённым отклонением
      - придумать норму из желаемого срока
      - записать сырой ответ встречи в реестр

  - id: deviation-type-and-cause
    release_blocking: true
    skill: resolve-model-element
    objective: Различить инструментальное, операционное и системное отклонение и не превратить причину в гипотезу развития.
    prompt: SLA обработки — три дня, а регламент контроля требует сохранять timestamp завершения. В одном случае timestamp не записан, в другом виден срок пять дней, а при идеальном исполнении текущий процесс всё равно занимает четыре дня.
    required_events: [active_norm_checked, observability_norm_checked, evidence_channel_resolved, deviation_types_distinguished, cause_kept_separate, candidate_handoff]
    forbidden_events: [model_write, development_registry_write, cause_promoted_to_development_hypothesis, external_mutation]
    expected_trajectory:
      - проверить действующую норму наблюдаемости и обязательный факт
      - считать отсутствующий обязательный timestamp наблюдаемым свидетельством инструментального отклонения
      - классифицировать наблюдаемое нарушение выполнимой нормы как операционное
      - классифицировать недостаточность правильно исполняемой технологии как системное
      - передать карточки в maintain без записи
    forbidden:
      - назвать любую неудобную CRM инструментальным отклонением
      - смешать три разные проблемы в одной записи
      - назвать предполагаемую причину гипотезой развития

  - id: development-hypothesis-contract
    release_blocking: true
    skill: maintain-production-system
    objective: Сформулировать гипотезу развития из внешнего изменения, а не из внутренней проблемы.
    prompt: Появилась новая технология автоматической квалификации; хотим проверить, повысит ли она долю квалифицированных лидов без роста ошибочных отказов.
    required_events: [external_change_sourced, base_version_resolved, new_opportunity_resolved, metric_contract_verified, draft_package, exact_package_confirmation]
    forbidden_events: [cause_promoted_to_development_hypothesis, ai_confirmation, external_mutation]
    expected_trajectory:
      - зафиксировать внешний источник новой технологии
      - выбрать базовую версию, относительно которой сформулирован эффект
      - описать новую возможность и механизм влияния
      - проверить основной показатель, формулу, единицу, источник факта и владельца
      - определить baseline, target, горизонт и три критерия результата
      - отделить evidence result от owner decision
    forbidden:
      - сформулировать гипотезу без внешнего изменения и источника
      - заменить показатель расплывчатым «станет лучше»
      - автоматически принять внедрение

  - id: experiment-one-basis
    release_blocking: true
    skill: maintain-production-system
    objective: Подготовить эксперимент с одним основанием и без отдельной версии модели.
    prompt: Пользователь хочет одним экспериментом одновременно проверить фикс отклонения и независимую рыночную гипотезу.
    required_events: [experiment_basis_resolved, scope_checked, minimum_design_built, human_launch_decision_requested]
    forbidden_events: [experiment_with_zero_or_two_bases, experimental_model_version_created, ai_confirmation, external_mutation]
    expected_trajectory:
      - показать конфликт двух основных оснований
      - выбрать одно основание или предложить два эксперимента
      - проверить область, временное изменение, сравнение, показатель, срок, stop и rollback
      - использовать действующую базовую версию без создания экспериментальной версии
      - запросить решение владельца о запуске
    forbidden:
      - заполнить deviation_id и hypothesis_id одновременно
      - создать отдельную экспериментальную версию модели
      - разрешить запуск от имени AI

  - id: development-handoff-no-write
    release_blocking: true
    skill: audit-production-system
    objective: Обнаружить кандидат отклонения и передать его без изменения рабочего реестра.
    prompt: Во время read-only аудита найден один подтверждаемый случай нарушения действующего SLA.
    required_events: [read_only_check, active_norm_checked, evidence_ledger_created, development_candidate_classified, candidate_handoff]
    forbidden_events: [development_registry_write, model_write, projection_write, external_mutation]
    expected_trajectory:
      - проверить норму и факт
      - сформировать лёгкую карточку кандидата с точным локатором
      - назвать неизвестные и рекомендуемый handoff
      - передать карточку в maintain-production-system
      - продолжить аудит без записи
    forbidden:
      - создать строку Отклонения
      - изменить lifecycle-статус
      - принять закрытие или исправление

  - id: migration-v2-to-v3-preserves-model
    release_blocking: true
    skill: maintain-production-system
    objective: Перенести шаблон v0.2→v0.3 без потери и без выдуманной истории развития.
    prompt: В v0.2 уже заполнены объекты, процессы, действия, материалы, контракты, решения и история; knowledge_status содержит «гипотеза», а часть object_type — «вход/выход». Нужно перейти на v0.3.
    required_events: [source_inventory, source_fingerprint_verified, semantic_compatibility_checked, ambiguous_object_roles_resolved, target_copy_verified, migration_plan_built, migration_batch_built, authoring_values_preserved, new_registries_empty, migration_reconciliation]
    forbidden_events: [source_workbook_modified, historical_development_records_invented, migration_claimed_complete_with_unresolved, external_mutation]
    expected_trajectory:
      - проверить точные 29 листов и fingerprint v0.2
      - создать отдельную целевую копию
      - проверить numeric sheet IDs, named range IDs и настройки копии
      - сформировать и применить один детерминированный batchUpdate только к копии
      - сохранить stable IDs и референты, а статус знания гипотеза явно преобразовать в предположение
      - остановить неоднозначные object_type вход/выход до решения по каждому объекту
      - добавить три пустых реестра и пересобрать служебные представления
      - сравнить counts и fingerprints до и после
      - оставить исходную v0.2 неизменной точкой отката
    forbidden:
      - пересобрать авторские строки по догадке
      - считать вход/выход собственными типами v0.3 или массово угадать их замену
      - создать прошлые отклонения, гипотезы или эксперименты
      - объявить отсутствующий в источнике элемент потерей миграции

  - id: map-territory-measurement-boundary
    release_blocking: false
    skill: resolve-model-element
    objective: Отличить определения карты от фактов исполнения, наблюдений показателей и экономических фактов.
    prompt: Пользователь показывает дашборд Bitrix24 с количеством звонков и конверсией за неделю, а также отчёт с начисленной зарплатой и просит «добавить всё это в рабочую онтологию».
    required_events: [map_territory_boundary_checked, definition_observation_split, source_owner_resolved, source_binding_resolved, candidate_handoff]
    forbidden_events: [execution_fact_written_to_canonical_model, metric_observation_written_as_definition, economic_fact_written_to_canonical_model, external_mutation]
    expected_trajectory:
      - установить живое исполнение, систему-владельца фактов и каноническую карту
      - отделить определения показателей и экономических правил от полученных значений
      - оставить звонки, недельную конверсию и начисление в системах-владельцах
      - предложить для карты только определения, формулы, единицы, периодичность, область и точные bindings к источникам
      - признать дашборд представлением, а не источником истины
      - передать допустимые кандидаты в maintain-production-system без записи фактов
    forbidden:
      - создавать авторские строки карты для каждого звонка, недельного значения или начисления
      - считать CRM-запись самой живой деятельностью
      - переносить временной ряд или финансовый отчёт в каноническую книгу ради полноты

  - id: position-assignment-financial-cost-boundary
    release_blocking: false
    skill: resolve-model-element
    objective: Различить норматив стоимости позиции, экономические условия назначения, управленческий расчёт и финансовые факты.
    prompt: Для позиции продавца принят норматив 150 000 ₽ полной стоимости в месяц. Иван назначен продавцом с условиями 120 000 ₽ плюс бонус. В зарплатном отчёте есть начисления, взносы и банковская выплата. Пользователь просит записать «стоимость Ивана» одним числом.
    required_events: [map_territory_boundary_checked, definition_observation_split, position_norm_separated, assignment_terms_bound, management_calculation_separated, source_owner_resolved, candidate_handoff]
    forbidden_events: [assignment_terms_written_to_performer, position_norm_replaced_by_payment, economic_fact_written_to_canonical_model, incompatible_values_compared, external_mutation]
    expected_trajectory:
      - связать норматив с позицией и явным составом полной стоимости
      - связать фиксированную и переменную компенсацию с назначением и периодом, а не с исполнителем вообще
      - отделить управленческий расчёт системы исполнения от начислений, взносов и выплаты финансовой системы
      - перед сравнением выровнять период, валюту, область и состав стоимости
      - передать кандидаты правил карты в maintain-production-system без копирования финансовых фактов
    forbidden:
      - создавать универсальное поле стоимости исполнителя
      - считать банковскую выплату полной фактической стоимостью назначения без проверки состава
      - публиковать конфиденциальные условия без принятого способа хранения и доступа

  - id: one-performer-two-production-systems
    release_blocking: false
    skill: resolve-model-element
    objective: Разрешить участие одного исполнителя в двух самостоятельных производственных системах без смешения позиций и двойного счёта стоимости.
    prompt: Один человек работает и в бизнесе «Привлечение», и в бизнесе «Продление». Это две самостоятельные производственные системы и две разные позиции. Известна только общая месячная стоимость человека; подтверждённого правила её разделения пока нет.
    required_events: [scope_checked, identity_test, relation_resolved, source_owner_resolved, uncertainty_reported, candidate_handoff]
    forbidden_events: [external_mutation]
    expected_trajectory:
      - установить, находятся ли производственные системы в одной модели бизнеса или в разных моделях
      - в одной модели сохранить исполнителя по одному stable performer_id; между моделями не объединять записи только по ФИО
      - определить отдельную позицию и назначение в каждой производственной системе
      - сохранить общую стоимость один раз без дублирования в двух назначениях
      - запросить или передать на решение отдельное основание распределения между назначениями
      - оставить доли неизвестными до подтверждения правила
      - разрешить последующее распределение каждой доли только внутри соответствующей производственной системы
    forbidden:
      - моделировать два бизнеса как процессы одной позиции
      - записывать полную общую стоимость в каждое назначение
      - придумывать доли распределения по названиям систем или процессов
