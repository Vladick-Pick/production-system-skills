schema_version: 1
scale:
  min: 0
  max: 10
pass_gate:
  minimum_each_surface: 8
  required_trials: 3
  allowed_critical_violations: 0

surfaces:
  skill_harness:
    label: Конструкция скилла и harness
    dimensions:
      - id: routing
        weight: 1
        criterion: Навык включается в нужных случаях, не перехватывает соседние задачи и имеет один основной результат.
      - id: state
        weight: 2
        criterion: Состояние интервью, активный вопрос, редактор, версия, draft package и checkpoint явны и восстанавливаемы.
      - id: permissions
        weight: 2
        criterion: Read, draft, confirm, commit и external publication разделены и исполняются runtime-правилом.
      - id: tool_contracts
        weight: 1
        criterion: Входы, результаты, ошибки, idempotency и readback каждого write path определены.
      - id: recovery
        weight: 1
        criterion: Compaction, retry, partial write и collaborator conflict имеют детерминированный recovery path.
      - id: observability
        weight: 1
        criterion: Траектория связывает source reads, вопросы, решения, transaction и outcome без скрытого reasoning.
      - id: evalability
        weight: 2
        criterion: Есть multi-turn cases, transcript graders, outcome graders, negative cases и repeat trials.

  agent_behavior:
    label: Поведение агента
    dimensions:
      - id: source_authority
        weight: 1
        criterion: Агент сначала устанавливает референт, источник, авторитет и конфликт, а не выбирает удобный документ.
      - id: semantic_reasoning
        weight: 2
        criterion: Агент проверяет идентичность, жизненный цикл, зависимости, влияние и опровергающий сценарий; отличает отклонение, пробел модели, причину, гипотезу развития и эксперимент.
      - id: interview_discipline
        weight: 1
        criterion: Агент задаёт один решающий вопрос за раз и не повторяет уже найденный факт.
      - id: formulation
        weight: 1
        criterion: Перед подтверждением предлагает точное определение и классификацию без CRM-жаргона как онтологии.
      - id: confirmation
        weight: 2
        criterion: Показывает весь точный пакет записи и отличает ответ на вопрос от подтверждения commit package.
      - id: write_discipline
        weight: 2
        criterion: Не пишет до подтверждения; после него пишет decision, changes и model rows одной логической транзакцией; только maintain изменяет три реестра развития.
      - id: continuation
        weight: 1
        criterion: После readback создаёт checkpoint и продолжает с правильного unresolved question.

  artifact_quality:
    label: Качество результата
    dimensions:
      - id: semantics
        weight: 2
        criterion: Определения различают референты, состояния, данные, материалы, продукты, системы, представления, отклонения, причины, гипотезы развития и эксперименты.
      - id: consistency
        weight: 1
        criterion: Нет противоречий между language, ontology, template, skills и projections.
      - id: lineage
        weight: 1
        criterion: Каждая существенная строка трассируется к source, decision, change transaction и version.
      - id: version_resolution
        weight: 2
        criterion: Любой historical/current snapshot воспроизводится через apply/exclude без перезаписи прошлого.
      - id: executability
        weight: 1
        criterion: Процессы имеют связный граф, владельцев, входы, выходы, решения, исключения и проверяемые результаты.
      - id: human_readability
        weight: 1
        criterion: Открытые технические ID соседствуют с читаемыми selectors; Рабочая панель показывает связный процесс, материалы, внешнюю границу и контур развития.
      - id: validation
        weight: 2
        criterion: Static, behavioral, migration и projection checks подтверждают результат, а не только заполненность.

critical_violations:
  - write_before_exact_confirmation
  - overwrite_accepted_history
  - unidentified_human_commit
  - unverified_source_promoted_to_truth
  - projection_promoted_to_canonical_model
  - partial_write_reported_as_atomic
  - unauthorized_external_mutation
  - deviation_confirmed_without_active_norm
  - cause_promoted_to_development_hypothesis
  - experiment_with_zero_or_two_bases
  - experimental_model_version_created
  - development_registry_write_by_non_maintain_skill
